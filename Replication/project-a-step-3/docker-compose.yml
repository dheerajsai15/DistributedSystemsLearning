services:
  app1:
    build: ./app
    hostname: app1
    environment:
      PORT: 3000
      REDIS_LEADER_HOST: redis
      REDIS_FOLLOWER_HOST: redis-replica
      RYW_WINDOW_MS: 20000

  app2:
    build: ./app
    hostname: app2
    environment:
      PORT: 3000
      REDIS_LEADER_HOST: redis
      REDIS_FOLLOWER_HOST: redis-replica
      RYW_WINDOW_MS: 20000

  app3:
    build: ./app
    hostname: app3
    environment:
      PORT: 3000
      REDIS_LEADER_HOST: redis
      REDIS_FOLLOWER_HOST: redis-replica
      RYW_WINDOW_MS: 20000

  redis:
    image: redis:7

  redis-replica:
    image: redis:7
    command: redis-server --replicaof redis 6379
    depends_on:
      - redis

  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
