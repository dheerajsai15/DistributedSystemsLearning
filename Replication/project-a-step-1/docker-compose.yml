services:
  app1:
    build: ./app
    hostname: app1
    environment:
      PORT: 3000

  app2:
    build: ./app
    hostname: app2
    environment:
      PORT: 3000

  app3:
    build: ./app
    hostname: app3
    environment:
      PORT: 3000

  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
